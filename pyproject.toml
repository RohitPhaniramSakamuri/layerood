[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "layerood"
version = "0.1.0"
description = "Local language-model embeddings and calibrated OOD detection with conditional layer residuals"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2,<3", "scipy>=1.13,<2", "scikit-learn>=1.5,<2", "torch>=2.6,<3", "transformers>=4.48,<5", "safetensors>=0.4", "threadpoolctl>=3.5"]

[project.optional-dependencies]
serve = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
layerood = "layerood.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/layerood"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/examples", "/pyproject.toml", "/uv.lock", "/README.md", "/APPROACH.md", "/REFERENCES.md", "/references.bib"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
